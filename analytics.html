{% extends "base.html" %}{% block title %}分析{% endblock %}
{% block content %}
<script>window.PAGE_TITLE_KEY='nav_analytics';</script>
<div class="kpis" id="kpis"></div>
<div class="card"><h3><span data-i18n="a_top_parts">热门件号</span> <span class="mut" data-i18n="a_top_parts_hint">（按报价行数）</span></h3>
<div style="overflow-x:auto"><table id="partsTbl"><thead><tr>
<th data-i18n="brand">品牌</th><th data-i18n="part_no">件号</th><th data-i18n="category">品类</th><th data-i18n="th_lines">报价行数</th><th data-i18n="th_qty">数量</th><th data-i18n="th_won_qty">成交量</th>
</tr></thead><tbody></tbody></table></div></div>
<div class="card"><h3><span data-i18n="a_top_vehicles">热门车型</span> <span class="mut" data-i18n="a_top_vehicles_hint">（按报价数）</span></h3>
<div style="overflow-x:auto"><table id="vehTbl"><thead><tr>
<th data-i18n="vehicle">车辆</th><th data-i18n="th_quotes">报价数</th><th data-i18n="st_won">成交</th><th data-i18n="th_won_amount">成交金额</th>
</tr></thead><tbody></tbody></table></div></div>
<div class="card"><h3><span data-i18n="a_tiers">各档位成交率</span> <span class="mut" data-i18n="a_tiers_hint">（含该档配件的报价 → 成交占比）</span></h3><div id="tiers"></div></div>
<div class="card"><h3 data-i18n="a_perday">每日报价数（近 14 天）</h3><div id="perday"></div></div>
<div class="card"><h3><span data-i18n="a_cats">热门品类</span> <span class="mut" data-i18n="a_cats_hint">（按报价行数）</span></h3><div id="cats"></div></div>
<div class="card"><h3 data-i18n="a_lost">未成交原因</h3><div id="lost"></div></div>
<div class="card"><h3 data-i18n="per_staff">按员工</h3>
<div style="overflow-x:auto"><table id="staffTbl"><thead><tr>
<th data-i18n="th_staff">员工</th><th data-i18n="th_quotes">报价数</th><th data-i18n="st_won">成交</th><th data-i18n="st_lost">未成交</th><th data-i18n="st_pending">待定</th><th data-i18n="kpi_rate">成交率</th><th data-i18n="th_won_amount">成交金额</th>
</tr></thead><tbody></tbody></table></div></div>
{% endblock %}

{% block script %}
<script>
function bar(label,val,max){
  const w=max?Math.round(val/max*100):0;
  return `<div class="bar"><span class="t">${label}</span>
    <span class="fill" style="width:${w}%"></span><span class="n">${val}</span></div>`;
}
async function load(){
  const a=await api('api/analytics');
  const c=a.conversion;
  const nd='<span class="mut">'+esc(T('no_data'))+'</span>';
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="v">${a.totals.quotes}</div><div class="l">${T('kpi_quotes')}</div></div>
    <div class="kpi"><div class="v" style="color:var(--good)">${a.totals.won}</div><div class="l">${T('kpi_won')}</div></div>
    <div class="kpi"><div class="v" style="color:var(--bad)">${a.totals.lost}</div><div class="l">${T('kpi_lost')}</div></div>
    <div class="kpi"><div class="v" style="color:var(--warn)">${a.totals.pending}</div><div class="l">${T('kpi_pending')}</div></div>
    <div class="kpi"><div class="v">${(c.rate*100).toFixed(0)}%</div><div class="l">${T('kpi_rate')}（${c.won}/${c.won+c.lost}）</div></div>`;
  const tm=Math.max(...a.by_tier.map(t=>t.total),1);
  document.getElementById('tiers').innerHTML=a.by_tier.map(t=>
    bar(`${tierName(t.tier)} · ${(t.rate*100).toFixed(0)}%（${t.won}/${t.total}）`,t.total,tm)).join('')||nd;
  const dm=Math.max(...a.per_day.map(d=>d.n),1);
  document.getElementById('perday').innerHTML=a.per_day.map(d=>bar(d.day,d.n,dm)).join('')||nd;
  const cm=Math.max(...a.top_categories.map(d=>d.n),1);
  document.getElementById('cats').innerHTML=a.top_categories.map(d=>bar(catName(d.name),d.n,cm)).join('')||nd;
  document.querySelector('#partsTbl tbody').innerHTML=(a.top_parts||[]).map(p=>
    `<tr><td>${esc(p.brand||'—')}</td><td>${esc(p.part_number)}</td><td class="mut">${esc(catName(p.category||''))}</td><td data-lbl="${esc(T('a_lines'))}">${p.lines}</td><td data-lbl="${esc(T('a_qty'))}">${p.qty||0}</td><td data-lbl="${esc(T('a_won_qty'))}"><b>${p.won_qty||0}</b></td></tr>`
  ).join('')||'<tr><td colspan="6" class="mut">'+esc(T('no_records'))+'</td></tr>';
  document.querySelector('#vehTbl tbody').innerHTML=(a.top_vehicles||[]).map(v=>
    `<tr><td>${esc(v.vehicle)}</td><td>${v.quotes}</td><td>${v.won||0}</td><td>$${(v.amount||0).toFixed(2)}</td></tr>`
  ).join('')||'<tr><td colspan="4" class="mut">'+esc(T('no_records'))+'</td></tr>';
  const lm=Math.max(...a.lost_reasons.map(d=>d.n),1);
  document.getElementById('lost').innerHTML=a.lost_reasons.map(d=>bar(d.reason||T('not_filled'),d.n,lm)).join('')||nd;
  document.querySelector('#staffTbl tbody').innerHTML=(a.per_staff||[]).map(s=>{
    const done=(s.won||0)+(s.lost||0);
    const rate=done?Math.round(s.won/done*100)+'%':'—';
    return `<tr><td><b>${esc(s.name)}</b></td><td>${s.quotes}</td><td>${s.won||0}</td><td>${s.lost||0}</td><td>${s.pending||0}</td><td><b>${rate}</b></td><td>$${(s.won_amount||0).toFixed(2)}</td></tr>`;
  }).join('')||'<tr><td colspan="7" class="mut">'+esc(T('no_records'))+'</td></tr>';
}
window.onLangChange=load;
load();
applyLang();
</script>
{% endblock %}
